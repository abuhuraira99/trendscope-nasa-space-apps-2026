[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trendscope"
version = "0.1.0"
description = "Find, visualise and test trends in NASA Earth science data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Abu Huraira" }, { name = "TrendScope contributors" }]
keywords = ["nasa", "earth-science", "time-series", "trend-analysis", "mann-kendall", "space-apps"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Repository = "https://github.com/abuhuraira99/trendscope-nasa-space-apps-2026"
Challenge = "https://www.spaceappschallenge.org/2026/challenges/earth-system-trend-detective/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
